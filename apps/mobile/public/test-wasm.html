<!DOCTYPE html>
<html>
<body>
<script type="module">
import sqlite3InitModule from './sqlite3.mjs';
async function run() {
  try {
    const sqlite3 = await sqlite3InitModule();
    console.log("FTS5 enabled:", sqlite3.capi.sqlite3_compileoption_used('ENABLE_FTS5'));
  } catch (e) {
    console.error(e);
  }
}
run();
</script>
</body>
</html>
