name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "apk-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Single source of truth for the release version is apps/mobile/app.config.ts
      # (expo prebuild consumes the same values), so cutting a release never
      # requires editing this workflow again: the APK filename, artifact paths,
      # release title/body and the versionCode note all derive from VERSION /
      # VERSION_CODE below. The step hard-fails if the parse ever comes up
      # empty, instead of silently shipping a misnamed APK.
      - name: Derive version from app.config.ts
        run: |
          VERSION=$(grep -oP "version: '\\K[0-9.]+" apps/mobile/app.config.ts | head -1)
          VERSION_CODE=$(grep -oP "versionCode: \\K[0-9]+" apps/mobile/app.config.ts | head -1)
          if [ -z "$VERSION" ] || [ -z "$VERSION_CODE" ]; then
            echo "Could not parse version/versionCode from apps/mobile/app.config.ts" >&2
            exit 1
          fi
          # Prerelease: any tag matching the apk-*-rc* glob (e.g. apk-v0.2.0-rc1)
          # publishes as a GitHub pre-release. Normal apk-* tags are unchanged.
          IS_PRERELEASE=false
          if [[ "$GITHUB_REF_NAME" == apk-*-rc* ]]; then
            IS_PRERELEASE=true
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          echo "Building nut-ai v$VERSION (versionCode $VERSION_CODE), prerelease=$IS_PRERELEASE (ref: $GITHUB_REF_NAME)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Android SDK is preinstalled on ubuntu-latest (/usr/local/lib/android/sdk)
      # with licenses accepted; AGP auto-installs the pinned NDK if missing.

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Build workspace packages
        run: npm run build --workspaces --if-present || true

      - name: Build nutrition.db corpus
        working-directory: tools/indian-dishes
        run: node build-sqlite.mjs

      - name: Expo prebuild (android)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          # STABLE CI SIGNING (owner QA 2026-10): the committed CI upload key
          # (apps/mobile/ci/ci-upload.keystore) makes every release APK
          # upgrade-safe — same signing key on every build, so versionCode N+1
          # installs as an update over N. The REAL release keystore stays
          # outside the repo; local builds keep using ~/.gradle credentials.
          ./gradlew assembleRelease --no-scan --console=plain \
            -PNUTAI_UPLOAD_STORE_FILE="$GITHUB_WORKSPACE/apps/mobile/ci/ci-upload.keystore" \
            -PNUTAI_UPLOAD_STORE_PASSWORD=nutai-ci-2026 \
            -PNUTAI_UPLOAD_KEY_ALIAS=nut-ai-ci \
            -PNUTAI_UPLOAD_KEY_PASSWORD=nutai-ci-2026

      - name: Verify release signature (fail if the debug fallback slipped in)
        run: |
          # AGP disables v1 JAR signing at minSdk>=24, so `keytool -printcert
          # -jarfile` sees nothing on a perfectly-signed APK. apksigner reads
          # the v2/v3 signature scheme block that release builds actually use.
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs --verbose "$APK" | tee /tmp/certs.txt
          grep -q "CN=Nut AI CI Upload" /tmp/certs.txt \
            && echo "Signed by the stable CI upload key" \
            || { echo 'APK is NOT signed with the stable CI key — upgrade installs would break'; exit 1; }

      - name: Rename APK
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "out/nut-ai-v$VERSION.apk"
          ls -lh out/

      # The checksum file is generated from inside out/ so it references the
      # bare APK filename — `sha256sum -c nut-ai-v$VERSION.apk.sha256` then
      # works in whatever directory both release assets are downloaded to.
      - name: SHA-256 checksum
        run: |
          (cd out && sha256sum "nut-ai-v$VERSION.apk" > "nut-ai-v$VERSION.apk.sha256")
          cat "out/nut-ai-v$VERSION.apk.sha256"
          SHA=$(cut -d' ' -f1 "out/nut-ai-v$VERSION.apk.sha256")
          echo "SHA256=$SHA" >> "$GITHUB_ENV"

      - name: Upload artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: nut-ai-apk
          path: out/nut-ai-v${{ env.VERSION }}.apk

      - name: Upload artifact (SHA-256 checksum)
        uses: actions/upload-artifact@v4
        with:
          name: nut-ai-apk-sha256
          path: out/nut-ai-v${{ env.VERSION }}.apk.sha256

      # tag_name and the title follow the pushed tag (github.ref_name), so the
      # release can never be attached to a stale hardcoded tag. NOTE: on
      # workflow_dispatch github.ref_name is the BRANCH name, not a tag —
      # dispatch runs are for smoke builds; cut real releases by pushing an
      # apk-* tag (apk-*-rc* publishes as a pre-release, see the derive step).
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Nut AI ${{ github.ref_name }} — Android APK"
          prerelease: ${{ env.IS_PRERELEASE }}
          # Per-release changelog: the body below is the v0.2.0 release notes
          # (drafted in docs/release-notes-draft-v0.2.0.md §2). Version strings
          # are derived — do not hardcode them back.
          body: |
            > Tag: `${{ github.ref_name }}` · versionCode ${{ env.VERSION_CODE }} · upgrade-installs over apk-v0.1.1

            ## Nut AI v${{ env.VERSION }} — Android APK

            ### New

            **Step-by-step onboarding, rebuilt**
            - The single-page form is gone: 12 guided steps (about you → body
              metrics → units → provider → plan), a gated Continue on each
              step, keyboard-friendly numeric entry, and a final "See my plan"
              reveal. Your answers persist as a draft, so an interrupted
              onboarding resumes where you left off.
            - Height and weight units are now independent: choose cm or ft/in
              for height and kg or lb for weight separately — in onboarding
              and later in Profile → Units & Health. Everything is stored
              canonically (kg, cm) and converted only for display.
            - A short optional tutorial after onboarding (5 cards, replayable
              from Profile, Skip always visible — it never traps you).

            **Local notifications (no cloud, no accounts)**
            - Meal reminders learned from your plan and rest-timer completion
              notices, scheduled entirely on the device via AlarmManager. No
              FCM, no push token.
            - The Android 13+ notification permission is asked CONTEXTUALLY —
              when you first enable a reminder or start a rest timer — never
              at app startup, and the app works fine if you decline. Manage
              everything in Profile → Notifications.

            **Three Android home-screen widgets**
            - **Today** (calories remaining + protein progress), **Quick
              Action** (one-tap log/scan/train), **Training** (your next
              scheduled session). They update from the app's own data
              on-device; if the snapshot goes stale they say "Open Nut AI to
              refresh" instead of guessing. Taps deep-link straight into the
              right screen.

            **Codex CLI as an AI provider (local bridge)**
            - Run `tools/codex-bridge` on your computer (requires the
              [Codex CLI](https://github.com/openai/codex) installed and
              logged in) and add a provider in the app pointing at the
              bridge's local URL. It exposes the OpenAI-compatible endpoints
              the app already speaks and translates them to `codex exec`.
            - What we verified by installing and probing real codex-cli
              0.160.0: the headless surface (`exec`, `-m` model, `-i` image
              files, `--json` event stream, `--output-schema`/`-o`,
              `--ephemeral`, sandbox flags) exists and parses, and failures
              map honestly — exit-code 1 + a truthful 401/403/429 envelope
              reaches the app instead of a generic "server error" (verified
              end-to-end through the real bridge/CLI).
            - What is NOT verified (needs API credentials): successful
              completions, model routing, image understanding quality, and
              JSON-schema enforcement — those shapes are documented by the
              CLI but not exercised by us.
            - Limitations: the bridge is plain HTTP on your local network (no
              TLS yet) — use it only on a network you trust; `codex exec` has
              no timeout flag; your Codex auth lives on your computer, never
              inside the APK.

            ### Fixed

            - **Home calorie breakdown animation:** the calorie card could
              open-close-open when tapped (duplicate press delivery on some
              Samsung/OneUI devices, amplified by the height spring restarting
              mid-flight). One tap now flips it exactly once, the spring is
              critically damped with overshoot clamping, and content
              re-measures can no longer restart the animation.
              Regression-locked in tests; the on-device tap behavior still
              needs the owner device pass.
            - **Routines screen jitter:** Create/New Routine re-fetched its
              lists in a focus-effect loop (4 SQLite round-trips per cycle,
              busy spinner flicker). Root cause fixed (stable callbacks +
              change fingerprint) with a red-first regression test that
              proves 25 refires before → 1 after.
            - **Workout modes, routines and programs, cleaned up:** honest
              "Start empty workout" wording, Simple/Advanced set fields named
              consistently, real advanced controls in the routine editor
              (progression labels, superset chips, per-exercise context),
              programs actually editable with a weekday↔cycle-day fix
              (schedules starting mid-week used to never fire), delete
              confirmations, dirty-exit guards, and an explainer for the
              program schedule.
            - **Android APK QA pass:** font-scaling contract enforced on every
              text input (31/31), screen-reader labels composed correctly on
              report rows, larger tap targets on dish chips, notification
              settings disabled-state made screen-reader-visible, barcode
              offline vs not-found told apart honestly, restore screen scrolls
              on small displays, and the onboarding plan button can no longer
              double-fire (double-tap previously double-persisted your goals).
              Health-step copy now says plainly that Health Connect for
              Android isn't built yet.

            ## Install on your phone

            1. If v0.1.0 is installed, UNINSTALL it first — v0.1.0 shipped with
               a one-off CI debug key, and Android forbids updating across
               signing keys (one-time step; releases from v0.1.1 on install as
               updates over each other).
            2. Download `nut-ai-v${{ env.VERSION }}.apk` below and tap it.
            3. Android will warn about unknown apps — choose **Install anyway /
               Allow from this source**.

            ## SHA-256 checksum

            Verify your download: the file `nut-ai-v${{ env.VERSION }}.apk.sha256`
            is attached to this release — put both files in one folder and run
            `sha256sum -c nut-ai-v${{ env.VERSION }}.apk.sha256`, or compare
            the APK hash against the value printed in the release body:

            ```
            ${{ env.SHA256 }}  nut-ai-v${{ env.VERSION }}.apk
            ```
          files: |
            out/nut-ai-v${{ env.VERSION }}.apk
            out/nut-ai-v${{ env.VERSION }}.apk.sha256
          fail_on_unmatched_files: true
