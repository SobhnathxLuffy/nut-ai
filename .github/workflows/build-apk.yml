name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "apk-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Single source of truth for the release version is apps/mobile/app.config.ts
      # (expo prebuild consumes the same values), so cutting a release never
      # requires editing this workflow again: the APK filename, artifact paths,
      # release title/body and the versionCode note all derive from VERSION /
      # VERSION_CODE below. The step hard-fails if the parse ever comes up
      # empty, instead of silently shipping a misnamed APK.
      - name: Derive version from app.config.ts
        run: |
          VERSION=$(grep -oP "version: '\\K[0-9.]+" apps/mobile/app.config.ts | head -1)
          VERSION_CODE=$(grep -oP "versionCode: \\K[0-9]+" apps/mobile/app.config.ts | head -1)
          if [ -z "$VERSION" ] || [ -z "$VERSION_CODE" ]; then
            echo "Could not parse version/versionCode from apps/mobile/app.config.ts" >&2
            exit 1
          fi
          # Prerelease: any tag matching the apk-*-rc* glob (e.g. apk-v0.2.0-rc1)
          # publishes as a GitHub pre-release. Normal apk-* tags are unchanged.
          IS_PRERELEASE=false
          if [[ "$GITHUB_REF_NAME" == apk-*-rc* ]]; then
            IS_PRERELEASE=true
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          echo "Building nut-ai v$VERSION (versionCode $VERSION_CODE), prerelease=$IS_PRERELEASE (ref: $GITHUB_REF_NAME)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Android SDK is preinstalled on ubuntu-latest (/usr/local/lib/android/sdk)
      # with licenses accepted; AGP auto-installs the pinned NDK if missing.

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Build workspace packages
        run: npm run build --workspaces --if-present || true

      - name: Build nutrition.db corpus
        working-directory: tools/indian-dishes
        run: |
          # fdc.nal.usda.gov intermittently refuses datacenter IPs (observed
          # 2026-10-12 on both CI runs). The corpus is content-derived — a
          # prebuilt copy with the REQUIRED_CORPUS_REVISION the tree pins is
          # published as the nutrition-corpus release asset and used as the
          # fallback when the live fetch fails.
          if ! node build-sqlite.mjs; then
            echo "Live corpus build failed — falling back to the released corpus asset"
            curl -fL --retry 3 "https://github.com/SobhnathxLuffy/nut-ai/releases/download/nutrition-corpus/nutrition.db.zip" -o /tmp/nutrition.db.zip
            unzip -o /tmp/nutrition.db.zip -d ../../apps/mobile/assets/
            ls -la ../../apps/mobile/assets/nutrition.db
          fi

      - name: Expo prebuild (android)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Raise Gradle heap
        working-directory: apps/mobile/android
        run: |
          # v0.4.0 packaging diagnosis: :app:packageRelease died of
          # OutOfMemoryError with the template 2 GiB heap — the dex/asset
          # packaging step needs more headroom on the CI runner than the
          # prebuild template grants. 4 GiB heap + 1 GiB metaspace.
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8/' gradle.properties
          grep gradle.jvmargs gradle.properties

      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          # STABLE CI SIGNING (owner QA 2026-10): the committed CI upload key
          # (apps/mobile/ci/ci-upload.keystore) makes every release APK
          # upgrade-safe — same signing key on every build, so versionCode N+1
          # installs as an update over N. The REAL release keystore stays
          # outside the repo; local builds keep using ~/.gradle credentials.
          ./gradlew assembleRelease --no-scan --console=plain --stacktrace \
            -PNUTAI_UPLOAD_STORE_FILE="$GITHUB_WORKSPACE/apps/mobile/ci/ci-upload.keystore" \
            -PNUTAI_UPLOAD_STORE_PASSWORD=nutai-ci-2026 \
            -PNUTAI_UPLOAD_KEY_ALIAS=nut-ai-ci \
            -PNUTAI_UPLOAD_KEY_PASSWORD=nutai-ci-2026

      - name: Verify release signature (fail if the debug fallback slipped in)
        run: |
          # AGP disables v1 JAR signing at minSdk>=24, so `keytool -printcert
          # -jarfile` sees nothing on a perfectly-signed APK. apksigner reads
          # the v2/v3 signature scheme block that release builds actually use.
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs --verbose "$APK" | tee /tmp/certs.txt
          grep -q "CN=Nut AI CI Upload" /tmp/certs.txt \
            && echo "Signed by the stable CI upload key" \
            || { echo 'APK is NOT signed with the stable CI key — upgrade installs would break'; exit 1; }

      - name: Rename APK
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "out/nut-ai-v$VERSION.apk"
          ls -lh out/

      # The checksum file is generated from inside out/ so it references the
      # bare APK filename — `sha256sum -c nut-ai-v$VERSION.apk.sha256` then
      # works in whatever directory both release assets are downloaded to.
      - name: SHA-256 checksum
        run: |
          (cd out && sha256sum "nut-ai-v$VERSION.apk" > "nut-ai-v$VERSION.apk.sha256")
          cat "out/nut-ai-v$VERSION.apk.sha256"
          SHA=$(cut -d' ' -f1 "out/nut-ai-v$VERSION.apk.sha256")
          echo "SHA256=$SHA" >> "$GITHUB_ENV"

      - name: Upload artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: nut-ai-apk
          path: out/nut-ai-v${{ env.VERSION }}.apk

      - name: Upload artifact (SHA-256 checksum)
        uses: actions/upload-artifact@v4
        with:
          name: nut-ai-apk-sha256
          path: out/nut-ai-v${{ env.VERSION }}.apk.sha256

      # tag_name and the title follow the pushed tag (github.ref_name), so the
      # release can never be attached to a stale hardcoded tag. NOTE: on
      # workflow_dispatch github.ref_name is the BRANCH name, not a tag —
      # dispatch runs are for smoke builds; cut real releases by pushing an
      # apk-* tag (apk-*-rc* publishes as a pre-release, see the derive step).
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Nut AI ${{ github.ref_name }} — Android APK"
          prerelease: ${{ env.IS_PRERELEASE }}
          # Per-release changelog: the body below is the v0.5.0 release notes
          # (docs/release-notes-v0.5.0.md). Version strings are derived — do
          # not hardcode them back.
          body: |
            > Tag: `${{ github.ref_name }}` · versionCode ${{ env.VERSION_CODE }} · upgrade-installs over apk-v0.4.0

            ## Nut AI v${{ env.VERSION }} — Android APK

            ### Your reported issues, fixed

            **1. The dates never switched to the new day (the big one)**
            - Home's day strip froze on the day the app was opened: keep the app in recents overnight and the new day never arrived — no chip to log "today".
            - The chips and the data read two different clocks, so an Oct 11 log rendered under the Oct 10 chip while tapping the Oct 11 chip showed the correct day-detail. Chips, home data and day-detail now run on ONE shared day anchor that rolls on focus and on app resume.

            **2. Routines → Add exercises: the search bar was unreachable**
            - The picker sheet stacked ~2.3k px above the screen edge: only the alphabet-tail of 30 exercises visible, search field invisible. Now: height-bounded scrollable body, search pinned at the top, the FULL 225-exercise catalog reachable, spacing restored, Done as a fixed footer.

            **3. Light mode**
            - Profile → Units & health → **Appearance**: **Match system / Light / Dark** — instant whole-app re-theme, remembered on the device. Default stays "Match system".

            **4. Meal detail: the black dead space**
            - After the keyboard closed, the meal editor stayed shrunken (Android KeyboardAvoidingView bug) leaving large dead areas. The container no longer shrinks on Android and the double-counted bottom inset is gone — the meal renders edge-to-edge.

            **5. AI scan quality on small models (aicredits.in and any gateway)**
            - The gateway output contract and the validator contradicted each other ("use 0 when unknown" vs a schema rejecting 0) — rule-following small models failed wholesale. Fixed on both ends: per-kind unknown-value contract, prompt v1.3.1 (beverage_category null for non-drinks), and a wider repair layer (zeroed/string gram ranges, numeric sizes, object-shaped assumptions, percent fills). Measured on aicredits.in: gemini-2.5-flash-lite 1/3 → 3/3 valid scans.

            ### New

            **6. Bulk JSON import for routines & programs**
            - Train tab → "Import routines & programs (JSON)" (also Profile → Your data): one file, any number of routines and programs. Exercises resolve by NAME, sets validated by the engine, weekday schedules ("Mon") converted against the start date, transactional + individually undoable, per-item problems listed. Loadable example in the screen; field reference in docs/training-import-format.md.

            **7. Workout-mode tutorial**
            - A sixth tutorial card teaches the live workout session by its real labels: set table, self-starting rest timer, set kinds (warmup/drop/failure/AMRAP), supersets A/B/C, "This week" progression banner, PRs and "Save as routine". Replay from Profile → "Replay the tutorial".

            ### Install on your phone
            1. Download `nut-ai-v${{ env.VERSION }}.apk` below.
            2. If v0.4.0 or earlier is installed, install straight over it (versionCode ${{ env.VERSION_CODE }} upgrades cleanly; your data migrates automatically).
            3. Fresh install: allow "install unknown apps" for your browser if asked.

            ### Verify the download (optional)
            ```
            ${{ env.SHA256 }}  nut-ai-v${{ env.VERSION }}.apk
            ```

            ### Honest verification status
            - Automated gates at this tag: 2,003 unit tests passing, 45/45 web e2e journeys (1 documented skip), lint, strict typecheck, node-purity 26/26, contrast 104/104 (light 52 + dark 52), data/IFCT/indian-dishes golden audits — all green.
            - Live-model scan evals ran against the real aicredits.in gateway (harness: eval/run-model.mjs). On-device rows (TalkBack, widgets on a real launcher, camera feel) remain NOT TESTED in CI — no Android environment in the build sandbox.

          files: |
            out/nut-ai-v${{ env.VERSION }}.apk
            out/nut-ai-v${{ env.VERSION }}.apk.sha256
          fail_on_unmatched_files: true
