name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "apk-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Android SDK is preinstalled on ubuntu-latest (/usr/local/lib/android/sdk)
      # with licenses accepted; AGP auto-installs the pinned NDK if missing.

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Build workspace packages
        run: npm run build --workspaces --if-present || true

      - name: Build nutrition.db corpus
        working-directory: tools/indian-dishes
        run: node build-sqlite.mjs

      - name: Expo prebuild (android)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          # STABLE CI SIGNING (owner QA 2026-10): the committed CI upload key
          # (apps/mobile/ci/ci-upload.keystore) makes every release APK
          # upgrade-safe — same signing key on every build, so versionCode N+1
          # installs as an update over N. The REAL release keystore stays
          # outside the repo; local builds keep using ~/.gradle credentials.
          ./gradlew assembleRelease --no-scan --console=plain \
            -PNUTAI_UPLOAD_STORE_FILE="$GITHUB_WORKSPACE/apps/mobile/ci/ci-upload.keystore" \
            -PNUTAI_UPLOAD_STORE_PASSWORD=nutai-ci-2026 \
            -PNUTAI_UPLOAD_KEY_ALIAS=nut-ai-ci \
            -PNUTAI_UPLOAD_KEY_PASSWORD=nutai-ci-2026

      - name: Verify release signature (fail if the debug fallback slipped in)
        run: |
          # AGP disables v1 JAR signing at minSdk>=24, so `keytool -printcert
          # -jarfile` sees nothing on a perfectly-signed APK. apksigner reads
          # the v2/v3 signature scheme block that release builds actually use.
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs --verbose "$APK" | tee /tmp/certs.txt
          grep -q "CN=Nut AI CI Upload" /tmp/certs.txt \
            && echo "Signed by the stable CI upload key" \
            || { echo 'APK is NOT signed with the stable CI key — upgrade installs would break'; exit 1; }

      - name: Rename APK
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk out/nut-ai-v0.1.1.apk
          ls -lh out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nut-ai-apk
          path: out/nut-ai-v0.1.1.apk

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v0.1.1
          name: "Nut AI v0.1.1 — Android APK"
          body: |
            ## Nut AI — Android release APK (v0.1.1, versionCode 2)

            Real-device QA fixes (Samsung physical device, release build):

            **Database (fixed the Progress / Routines crash)**
            - Progress → Overview and Train → Routines crashed with a native
              `NativeDatabase.prepareAsync` NullPointerException on Android.
              Root cause: duplicate SQLite handles for user.db were opened per
              screen (onboarding persist, scan recents, assistant, dish
              composer); when Android's JS garbage collector collected one of
              the throwaway wrappers, expo-sqlite destroyed the SHARED native
              database for the whole app. All handles are now process-wide
              singletons and retained for the app's lifetime; queries can no
              longer run against a destroyed handle.
            - DB errors now surface with the database, operation and statement
              named (plus an explanation when the released-handle signature is
              detected) instead of a raw Java NPE.
            - Regression locks added: cold boot, upgrade/migration, repeated
              queries, screen interleaving, background/resume, singleton
              identity — plus width-sweep UI tests at 360/384/390/412/432 px.

            **Food quick actions (fixed one-character vertical pills)**
            - "Scan food / Indian dishes / Recipes / …" collapsed to ~0 width on
              device (percentage widths inside a wrap+gap container measured
              wrong under Yoga). Tiles now take exact computed widths: 2
              columns on phones, 3 on tablets, with a hard readable floor.

            **Progress top navigation (fixed clipped "Training" tab)**
            - The section row now wraps to a second line on narrow screens —
              every label fully visible, nothing clipped, no hidden scroll.

            **Home (fixed bottom overlap + date strip clipping)**
            - Scroll content clears the floating tab bar + FAB + Android
              gesture bar by real measured insets, not magic numbers.
            - Day strip columns are exact-width (~7 visible), no more
              left/right clipping; labels cap at 1.2× so large font scales
              wrap instead of clip (font scaling itself stays ON).

            **Onboarding is ONE page**
            - The 12-screen flow (three questions per page, page after page)
              is now a single scrollable form with one "See my plan" button,
              then the plan reveal. Every control is the same widget as before.

            ## Install on your phone
            1. If v0.1.0 is installed, UNINSTALL it first — v0.1.0 shipped with
               a one-off CI debug key, and Android forbids updating across
               signing keys (one-time step; future updates install over each other).
            2. Tap `nut-ai-v0.1.1.apk` below and download it.
            3. Android will warn about unknown apps — choose **Install anyway / Allow from this source**.
          files: out/nut-ai-v0.1.1.apk
          fail_on_unmatched_files: true
